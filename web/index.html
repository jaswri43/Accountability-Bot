<!doctype html>
<html lang="en" data-theme="dark" data-accent="violet">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoL Accountability</title>
    <!-- Applies the cached appearance before first paint, so there's no flash
         of the default theme while /me loads. Same storage key and values as
         src/lib/appearance.ts. -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("appearance") || "null");
          var root = document.documentElement;
          if (saved && (saved.theme === "dark" || saved.theme === "light")) root.dataset.theme = saved.theme;
          if (saved && ["violet", "lime", "teal", "amber"].indexOf(saved.accent) >= 0) root.dataset.accent = saved.accent;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
